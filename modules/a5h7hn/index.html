<footer class="modulex-dyz{{dyzsinif}}" role="contentinfo">
  <div class="modulex-dyz-ic">
    <div class="modulex-dyz-ust">
      <div class="modulex-dyz-marka">
        <a class="modulex-dyz-logo" href="/{{lang}}/" aria-label="@home@ - {{web-name}}">
          <img src="/img/{{logo}}" alt="{{web-name}}" loading="lazy" decoding="async" />
        </a>
        {{dyzhakkinda}}
      </div>
      <nav class="modulex-dyz-kol modulex-dyz-sayfalar" aria-label="@navigation@">
        <h2 class="modulex-dyz-baslik">@pages@</h2>
        <ul class="modulex-dyz-liste modulex-dyz-liste--iki">{{dyzsayfa}}</ul>
      </nav>
      {{dyziletisim}}
      {{dyzsosyal}}
    </div>
  </div>
  <div class="modulex-dyz-yazi-kap" aria-hidden="true">
    <span class="modulex-dyz-yazi">{{dyzyazi}}</span>
  </div>
  <div class="modulex-dyz-alt">
    <div class="modulex-dyz-alt-ic">
      <p class="modulex-dyz-telif">&copy; {{dyzyil}} {{web-name}} · @all-rights@</p>
      <div class="modulex-dyz-dil">{{langbar}}</div>
      <a class="modulex-dyz-yukari" href="#" aria-label="@back-to-top@">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
      </a>
    </div>
  </div>
</footer>

<style>
  /* footer-dev-yazi — dev marka yazısı (15 Kas 2026, G3). Üstte sade sütunlar; ortada sayfa genişliğini dolduran site adı
     (JS sığdırır; JS yoksa clamp) — kirp:true iken harflerin alt kısmı kesilir, footer'ın «zemini» olur. Altta ince telif satırı +
     dil + yukarı düğmesi. Renkler yalnız desing anahtarından (var(--mx-site-*) varsayılanlı); mantıksal CSS → RTL. */
  .modulex-dyz {
    box-sizing: border-box;
    width: 100%;
    overflow: hidden;
    background: --bg--;
    color: --text--;
    font-family: var(--mx-font-sans, inherit);
  }
  .modulex-dyz *,
  .modulex-dyz *::before,
  .modulex-dyz *::after { box-sizing: border-box; }
  .modulex-dyz-ic,
  .modulex-dyz-alt-ic { max-width: --max--; margin-inline: auto; padding-inline: 24px; }
  .modulex-dyz-ust {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: 40px;
    padding-block: 64px 32px;
  }
  .modulex-dyz--sade .modulex-dyz-ust { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .modulex-dyz-logo { display: inline-flex; align-items: center; min-height: 44px; }
  .modulex-dyz-logo img {
    display: block;
    height: auto;
    width: auto;
    max-height: --logo_h--;
    max-width: 200px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .modulex-dyz-logo img[src*=".svg"] { height: --logo_h--; width: auto; max-width: none; }
  .modulex-dyz-hakkinda { margin: 16px 0 0; max-width: 34ch; color: --muted--; line-height: 1.6; }
  .modulex-dyz-baslik {
    margin: 0 0 14px;
    color: --muted--;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .modulex-dyz-liste { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .modulex-dyz-liste--iki { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
  .modulex-dyz-liste span { display: block; padding-block: 10px; line-height: 1.5; }
  .modulex-dyz .modulex-dyz-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 44px;
    color: --text--;
    text-decoration: none;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: color 0.25s ease, gap 0.25s ease;
  }
  .modulex-dyz .modulex-dyz-link .material-symbols-outlined {
    font-size: 16px;
    opacity: 0;
    transform: translate(-4px, 4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  [dir="rtl"] .modulex-dyz .modulex-dyz-link .material-symbols-outlined { transform: scaleX(-1) translate(-4px, 4px); }
  .modulex-dyz .modulex-dyz-link:hover,
  .modulex-dyz .modulex-dyz-link:focus-visible,
  .modulex-dyz .modulex-dyz-link[aria-current="page"] { color: --accent--; }
  .modulex-dyz .modulex-dyz-link:hover .material-symbols-outlined,
  .modulex-dyz .modulex-dyz-link:focus-visible .material-symbols-outlined { opacity: 1; transform: none; }
  [dir="rtl"] .modulex-dyz .modulex-dyz-link:hover .material-symbols-outlined,
  [dir="rtl"] .modulex-dyz .modulex-dyz-link:focus-visible .material-symbols-outlined { transform: scaleX(-1); }
  .modulex-dyz .modulex-dyz-link:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  .modulex-dyz-sosyal { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .modulex-dyz .modulex-dyz-sosyal-a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1px solid --line--;
    border-radius: 50%;
    color: --text--;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .modulex-dyz .modulex-dyz-sosyal-a:hover,
  .modulex-dyz .modulex-dyz-sosyal-a:focus-visible { border-color: --accent--; color: --accent--; }

  .modulex-dyz-yazi-kap {
    padding-inline: 16px;
    line-height: 0.8;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .modulex-dyz-yazi {
    display: inline-block;
    max-width: 100%;
    color: --yaziRenk--;
    font-family: var(--mx-font-heading, inherit);
    font-size: clamp(3rem, 15vw, 16rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.82;
    white-space: nowrap;
    animation: modulex-dyz-yuksel 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  html[lang="ar"] .modulex-dyz-yazi,
  html[lang="fa"] .modulex-dyz-yazi,
  html[lang="ur"] .modulex-dyz-yazi,
  html[lang="he"] .modulex-dyz-yazi { letter-spacing: 0; line-height: 1.1; }
  .modulex-dyz--kirp .modulex-dyz-yazi-kap { height: 0.62em; font-size: clamp(3rem, 15vw, 16rem); overflow: hidden; }
  .modulex-dyz--kirp .modulex-dyz-yazi { font-size: 1em; }
  .modulex-dyz-yazi-kap.modulex-dyz--sigdi { font-size: var(--dyz-boy); }
  .modulex-dyz-yazi-kap.modulex-dyz--sigdi .modulex-dyz-yazi { font-size: var(--dyz-boy); }
  .modulex-dyz--kirp .modulex-dyz-yazi-kap.modulex-dyz--sigdi .modulex-dyz-yazi { font-size: 1em; }

  .modulex-dyz-alt { border-block-start: 1px solid --line--; }
  .modulex-dyz-alt-ic {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding-block: 14px;
  }
  .modulex-dyz-telif { flex: 1 1 260px; margin: 0; color: --muted--; font-size: 0.85rem; }
  .modulex-dyz-dil { display: flex; align-items: center; color: --text--; }
  .modulex-dyz .modulex-dyz-yukari {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: --accent--;
    color: --accentText-- !important;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .modulex-dyz .modulex-dyz-yukari:hover { transform: translateY(-4px); }
  .modulex-dyz .modulex-dyz-yukari:focus-visible { outline: 2px solid --text--; outline-offset: 3px; }

  @keyframes modulex-dyz-yuksel { from { opacity: 0; transform: translateY(18%); } to { opacity: 1; transform: none; } }

  @media (max-width: 1024px) {
    .modulex-dyz-ust { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-dyz-ust,
    .modulex-dyz--sade .modulex-dyz-ust { grid-template-columns: minmax(0, 1fr); padding-block: 44px 24px; gap: 28px; }
    .modulex-dyz-ic,
    .modulex-dyz-alt-ic { padding-inline: 18px; }
    .modulex-dyz-alt-ic { justify-content: space-between; }
    .modulex-dyz-telif { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-dyz * { transition: none !important; animation: none !important; }
  }
</style>

<script>
  (() => {
    const kok = document.querySelector(".modulex-dyz");
    if (!kok || kok.dataset.dyzHazir) return;
    kok.dataset.dyzHazir = "1";
    const kap = kok.querySelector(".modulex-dyz-yazi-kap");
    const yazi = kok.querySelector(".modulex-dyz-yazi");
    /* site adını kap genişliğine sığdır (tek satır, en çok 22vw) — uzun adlar taşmaz, kısa adlar dev olur */
    const sigdir = () => {
      if (!kap || !yazi) return;
      kap.classList.remove("modulex-dyz--sigdi");
      const boy = parseFloat(getComputedStyle(yazi).fontSize) || 48;
      const genis = kap.clientWidth - 32;
      const olcu = yazi.scrollWidth || 1;
      const yeni = Math.max(32, Math.min(boy * (genis / olcu), window.innerWidth * 0.22));
      kap.style.setProperty("--dyz-boy", `${yeni.toFixed(1)}px`);
      kap.classList.add("modulex-dyz--sigdi");
    };
    sigdir();
    document.fonts?.ready?.then(sigdir);
    let bekle = 0;
    window.addEventListener("resize", () => { cancelAnimationFrame(bekle); bekle = requestAnimationFrame(sigdir); }, { passive: true });
    kok.querySelector(".modulex-dyz-yukari")?.addEventListener("click", (e) => {
      e.preventDefault();
      const azHareket = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: azHareket ? "auto" : "smooth" });
      document.querySelector("header a[href], a[href]")?.focus({ preventScroll: true });
    });
  })();
</script>
